 const draw=()=>{r.render(s,c);for(const t of thumbs)t.getContext('2d').drawImage(r.domElement,0,0,t.width,t.height);};draw();el.querySelector('input').oninput=e=>{m.rotation.y=+e.target.value*Math.PI/180;draw();};window.voxelChecks.push({file,size:size.toArray(),bottom:box.min.y});
