<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>第24～30条 · 方块棋子验收</title>
<style>*{box-sizing:border-box}body{margin:0;background:#272a2b;color:#eee4d1;font:16px system-ui}main{max-width:1200px;margin:auto;padding:24px}h1{font-size:26px}p{line-height:1.6;color:#c6baa6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px}article{background:#353737;border-radius:12px;padding:16px}h2{font-size:20px}img{display:block;width:100%;height:230px;object-fit:cover;object-position:top;border-radius:6px}a{color:#eabe72}nav{display:flex;gap:16px;flex-wrap:wrap;margin-top:16px}nav a{padding:10px 0}article p{min-height:52px}</style>
<main><h1>第24～30条 · 方块棋子验收</h1><p>7条合成链，共44个模型。32格方块，无投影；各链均可旋转查看、隐藏名称检查辨识度，并进入斜45°棋盘合成。此批为独立样品，待验收。</p><div class="grid"></div></main>
<script type="module">
import {batchChains} from '/merge/batch-chains.js';
for(const c of batchChains.filter(c=>c.seq<=30)){const a=document.createElement('article');a.innerHTML=`<h2>${c.seq} · ${c.title} · ${c.count}级</h2><a href="voxel.html?chain=${c.key}"><img src="${c.key}-preview.png" alt="${c.title}模型预览"></a><p>${c.detail}</p><nav><a href="voxel.html?chain=${c.key}">查看全链模型</a><a href="/merge/?voxel=1&${c.key}=1">棋盘体验</a><a href="voxel-${c.key}.blend">Blender源文件</a></nav>`;document.querySelector('.grid').append(a)}
</script></html>
