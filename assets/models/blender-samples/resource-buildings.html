<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>基地建筑模型预览</title>
<style>*{box-sizing:border-box}body{margin:0;background:#292b2d;color:#f2e6d0;font:15px system-ui,sans-serif}main{max-width:1400px;margin:auto;padding:20px}h1{margin:0 0 6px;font-size:24px}p{color:#c9bda9}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}article{background:#3a3a38;border:1px solid #5b5143;border-radius:10px;padding:10px}h2{font-size:17px;margin:4px 0 8px}canvas{width:100%!important;height:auto!important;display:block;border-radius:7px;background:#c7b99b}a{color:#f0c879}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.grid{grid-template-columns:1fr}main{padding:12px}}
</style><script type="importmap">{"imports":{"three":"/vendor/three.module.js","three/addons/":"/vendor/addons/"}}</script>
<main><h1>资源与支援建筑 · 正式模型预览</h1><p>统一方块卡通材质；拖动模型旋转，滚轮缩放。模型按正式建筑 cfgId 对应。</p><div class="grid"></div></main>
<script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const items=[['203','风力发电站','power_station.glb'],['202','医疗站','medical_station.glb'],['206','工坊','workshop.glb'],['204','前哨站','outpost.glb'],['205','仓库','warehouse.glb'],['207','收集站','collection_station.glb'],['208','弹药库','ammo_depot.glb'],['209','雷达站','radar_station.glb'],['210','维修站','repair_station.glb']];
const loader=new GLTFLoader();
for(const [id,label,file] of items){const card=document.createElement('article');card.innerHTML='<h2>cfgId '+id+' · '+label+'</h2>';const host=document.createElement('div');card.append(host);const link=document.createElement('a');link.href=file;link.textContent='下载 GLB';link.download='';card.append(link);document.querySelector('.grid').append(card);
 const r=new T.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.toneMapping=T.ACESFilmicToneMapping;r.setSize(420,300);host.append(r.domElement);const s=new T.Scene();s.background=new T.Color('#c7b99b');s.add(new T.HemisphereLight(0xfff0d0,0x4e5c66,2.1));const l=new T.DirectionalLight(0xffdfb2,3);l.position.set(-3,6,-4);s.add(l);const ground=new T.Mesh(new T.BoxGeometry(1.5,.08,1.5),new T.MeshStandardMaterial({color:'#8d704c',roughness:1}));ground.position.y=-.04;s.add(ground);
 const c=new T.OrthographicCamera(-1.35,1.35,1.0,-1.0,.1,30);c.position.set(2.6,2.1,3.1);const ctl=new OrbitControls(c,r.domElement);ctl.target.set(0,.55,0);ctl.enableDamping=true;ctl.maxPolarAngle=Math.PI*.48;
 const {scene:m}=await loader.loadAsync(file);m.traverse(o=>{if(o.isMesh){o.castShadow=false;o.receiveShadow=false}});s.add(m);const box=new T.Box3().setFromObject(m),size=box.getSize(new T.Vector3());const max=Math.max(size.x,size.y,size.z,1);c.left=-1.15*max;c.right=1.15*max;c.top=.85*max;c.bottom=-.85*max;c.updateProjectionMatrix();ctl.update();r.setAnimationLoop(()=>{ctl.update();r.render(s,c)});
}
</script></html>
