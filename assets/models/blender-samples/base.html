<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>13×13 正式基地素材</title>
<style>*{box-sizing:border-box}body{margin:0;background:#202d34;color:#e4dfd1;font:15px system-ui}header{padding:16px 24px;background:#2d4048}h1{font-size:22px;margin:0 0 8px}p{margin:8px 0;line-height:1.6}nav{display:flex;gap:16px;flex-wrap:wrap}a{color:#efbd68}#stage{height:72vh;min-height:350px;position:relative}canvas{display:block;width:100%;height:100%;touch-action:none}footer{padding:16px 24px}label{display:inline-flex;gap:6px;align-items:center}select{padding:7px;background:#354951;color:white;max-width:100%}#status{color:#d5c193}</style>
<script type="importmap">{"imports":{"three":"/vendor/three.module.js","three/addons/":"/vendor/addons/"}}</script>
<header><h1>13×13 基地 · 正式配置布局</h1><p>169格 · 初始领地49格 · 东侧4/5/6行开口 · 模块可独立替换</p><nav><label>查看<select id="asset"><option value="base_13x13_voxel">完整基地</option><option value="base_core">核心</option><option value="base_ground">地块</option><option value="base_grass">杂草</option><option value="base_woods">树林</option><option value="base_rubble">瓦砾</option><option value="base_shack">破旧建筑</option><option value="base_pond">水池</option><option value="base_ruin">外围废墟</option></select></label><label><input type="checkbox" id="claimed" checked>初始领地边界</label><label><input type="checkbox" id="terrain" checked>地形</label><label><input type="checkbox" id="ruins" checked>废墟</label></nav></header>
<div id="stage"></div><footer><div id="status">加载中…</div><p>拖动旋转，滚轮/双指缩放。隐藏仅用于检查素材，不代表实际解锁或坍塌。</p><nav><a id="download" href="base_13x13_voxel.glb" download>下载当前GLB</a><a href="base_13x13-layout.json">布局JSON</a><a href="base_13x13_voxel.blend">Blender源文件</a></nav></footer>
<script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const stage=document.querySelector('#stage'),scene=new T.Scene();scene.background=new T.Color('#202d34');const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.shadowMap.enabled=false;renderer.toneMapping=T.ACESFilmicToneMapping;stage.append(renderer.domElement);
scene.add(new T.HemisphereLight(0xffffff,0x6d5745,1.5));const light=new T.DirectionalLight(0xffedcd,2.6);light.position.set(-5,12,8);scene.add(light);
const camera=new T.OrthographicCamera(-10,10,10,-10,.1,100),controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.maxPolarAngle=Math.PI*.48;
let model,span=11,serial=0;const cache=new Map(),loader=new GLTFLoader();const layout=await fetch('base_13x13-layout.json').then(r=>r.json());
const boundary=new T.LineLoop(new T.BufferGeometry().setFromPoints([[-3.5,.008,-3.5],[3.5,.008,-3.5],[3.5,.008,3.5],[-3.5,.008,3.5]].map(p=>new T.Vector3(...p))),new T.LineBasicMaterial({color:0xe5b864}));scene.add(boundary);
function resize(){const w=stage.clientWidth,h=stage.clientHeight,a=w/h;camera.left=-span*Math.max(1,a);camera.right=-camera.left;camera.top=span*Math.max(1,1/a);camera.bottom=-camera.top;camera.updateProjectionMatrix();renderer.setSize(w,h)}
function visibility(){const full=document.querySelector('#asset').value==='base_13x13_voxel';boundary.visible=full&&document.querySelector('#claimed').checked;model?.traverse(o=>{if(o.name.startsWith('terrain_'))o.visible=document.querySelector('#terrain').checked;if(o.name.startsWith('building_')&&o.name!=='building_6_6')o.visible=document.querySelector('#ruins').checked})}
async function show(){const token=++serial,key=document.querySelector('#asset').value;window.baseReady=false;document.querySelector('#status').textContent='加载中…';try{if(!cache.has(key))cache.set(key,loader.loadAsync(key+'.glb'));const g=await cache.get(key);if(token!==serial)return;if(model)scene.remove(model);model=g.scene;scene.add(model);span=key==='base_13x13_voxel'?10.3:.85;controls.target.set(0,key==='base_13x13_voxel'?0:.35,0);camera.position.set(-10,Math.sqrt(200),-10).add(controls.target);camera.zoom=1;controls.update();resize();visibility();document.querySelector('#download').href=key+'.glb';document.querySelector('#status').textContent=key==='base_13x13_voxel'?'正式布局：'+layout.tiles.length+'格 / '+layout.buildings.length+'个建筑实例（含核心）':'独立单格模块：'+key;window.baseReady=true;window.basePreview={scene,model,camera,renderer,layout};}catch(e){document.querySelector('#status').textContent='加载失败：'+e.message;console.error(e)}}
document.querySelector('#asset').onchange=show;for(const id of ['claimed','terrain','ruins'])document.getElementById(id).onchange=visibility;new ResizeObserver(resize).observe(stage);renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});await show();
</script></html>
